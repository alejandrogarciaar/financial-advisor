name: Telegram tactical signals

# Cada hora + disparo manual (Actions -> este workflow -> "Run workflow"). No todas las corridas
# van a tener algo que avisar (la mayoría de las horas ninguna señal cambia) — el chequeo mismo
# corre siempre, el mensaje de Telegram solo sale cuando algo realmente cambió de estado. Las
# señales están validadas sobre velas DIARIAS (ver CLAUDE.md); revisar cada hora no agrega
# información nueva entre un cierre y el siguiente, pero reacciona más rápido dentro del mismo
# día y agrega resiliencia si una corrida falla.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Los 2 scripts leen/escriben el mismo app_data/tactical_signal_state.json — corren
      # secuencialmente en el mismo job (no en jobs paralelos) para no arriesgar una carrera
      # de escritura sobre ese archivo.
      - run: python scripts/telegram_stock_signals.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: python scripts/telegram_crypto_signals.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # GitHub Actions arranca de un checkout limpio cada corrida — sin esto, el archivo que
      # recuerda "qué señal ya se avisó" no sobrevive entre corridas y cada una re-avisaría
      # todo. Mismo mecanismo ya usado para portfolio_data/ (commitear el estado al repo).
      # "[skip ci]" evita que este commit dispare otro run.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app_data/tactical_signal_state.json
          git diff --cached --quiet || git commit -m "Update tactical signal state [skip ci]"
          git push
